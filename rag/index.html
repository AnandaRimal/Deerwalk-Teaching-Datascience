<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced RAG Text Splitter Visualizer</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --panel: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 1600px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        .input-section { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 14px; resize: vertical; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; border-top: 4px solid var(--primary); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .panel h3 { margin-top: 0; display: flex; align-items: center; justify-content: space-between; font-size: 1.1rem; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: #f1f5f9; padding: 10px; border-radius: 6px; }
        label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        input { padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .chunk-container { max-height: 400px; overflow-y: auto; font-size: 0.85rem; }
        .chunk { padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #cbd5e1; background: #fff; transition: transform 0.1s; position: relative; }
        .chunk:hover { transform: scale(1.01); border-left-color: var(--primary); }
        .chunk-meta { font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
        .stats { font-size: 0.8rem; background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        
        /* Specific Colors for Visual Distinction */
        .char-panel { border-top-color: #ef4444; }
        .rec-panel { border-top-color: #f59e0b; }
        .tok-panel { border-top-color: #10b981; }
        .sent-panel { border-top-color: #8b5cf6; }
        .struct-panel { border-top-color: #ec4899; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RAG Text Splitter Visualizer</h1>
        <p>Compare how different strategies segment your data for vector databases.</p>
    </header>
    
    <div class="input-section">
        <label>Input Text (Markdown/Sentences/Paragraphs):</label>
        <textarea id="sourceText"># Introduction
Retrieval-Augmented Generation (RAG) is a technique that enhances LLMs. It provides relevant external information to the model.

## Why Split?
Text splitting is a crucial preprocessing step for RAG. 
1. It involves breaking down large documents. 
2. It allows for efficient storage.

By doing this, only relevant context is fed into the LLM. This improves response accuracy. It also reduces hallucinations significantly!</textarea>
    </div>

    <div class="grid">
        <div class="panel char-panel">
            <h3>Character <span class="stats" id="charStats">0</span></h3>
            <div class="controls">
                <div><label>Size</label><input type="number" id="charSize" value="100"></div>
                <div><label>Overlap</label><input type="number" id="charOverlap" value="20"></div>
            </div>
            <div class="chunk-container" id="charChunks"></div>
        </div>

        <div class="panel rec-panel">
            <h3>Recursive <span class="stats" id="recStats">0</span></h3>
            <div class="controls">
                <div><label>Max Chars</label><input type="number" id="recSize" value="120"></div>
            </div>
            <div class="chunk-container" id="recChunks"></div>
        </div>

        <div class="panel tok-panel">
            <h3>Token (Proxy) <span class="stats" id="tokStats">0</span></h3>
            <div class="controls">
                <div><label>Words</label><input type="number" id="tokSize" value="15"></div>
                <div><label>Overlap</label><input type="number" id="tokOverlap" value="5"></div>
            </div>
            <div class="chunk-container" id="tokChunks"></div>
        </div>

        <div class="panel sent-panel">
            <h3>Sentence <span class="stats" id="sentStats">0</span></h3>
            <div class="controls">
                <div><label>Min Length</label><input type="number" id="sentMin" value="1"></div>
            </div>
            <div class="chunk-container" id="sentChunks"></div>
        </div>

        <div class="panel struct-panel">
            <h3>Markdown Struct <span class="stats" id="structStats">0</span></h3>
            <div class="controls">
                <div style="grid-column: span 2; font-size: 10px; color: #666;">Splits by # Headers</div>
            </div>
            <div class="chunk-container" id="structChunks"></div>
        </div>
    </div>
</div>

<script>
    const source = document.getElementById('sourceText');

    function createChunkUI(text, size, unit) {
        return `<div class="chunk"><div class="chunk-meta">Size: ${size} ${unit}</div>${text}</div>`;
    }

    function update() {
        const text = source.value;

        // 1. Character Split
        const cSize = parseInt(document.getElementById('charSize').value);
        const cOver = parseInt(document.getElementById('charOverlap').value);
        let cChunks = [];
        for(let i=0; i<text.length; i+=(cSize-cOver)) {
            cChunks.push(text.substring(i, i+cSize));
            if(i+cSize >= text.length) break;
        }
        document.getElementById('charChunks').innerHTML = cChunks.map(c => createChunkUI(c, c.length, 'chars')).join('');
        document.getElementById('charStats').innerText = cChunks.length;

        // 2. Recursive (Simplified logic)
        const rSize = parseInt(document.getElementById('recSize').value);
        const rChunks = text.split('\n\n').flatMap(p => p.length > rSize ? p.split('\n') : p);
        document.getElementById('recChunks').innerHTML = rChunks.map(c => createChunkUI(c, c.length, 'chars')).join('');
        document.getElementById('recStats').innerText = rChunks.length;

        // 3. Token Proxy (Words)
        const tSize = parseInt(document.getElementById('tokSize').value);
        const tOver = parseInt(document.getElementById('tokOverlap').value);
        const words = text.split(/\s+/);
        let tChunks = [];
        for(let i=0; i<words.length; i+=(tSize-tOver)) {
            tChunks.push(words.slice(i, i+tSize).join(' '));
            if(i+tSize >= words.length) break;
        }
        document.getElementById('tokChunks').innerHTML = tChunks.map(c => createChunkUI(c, c.split(' ').length, 'tokens')).join('');
        document.getElementById('tokStats').innerText = tChunks.length;

        // 4. Sentence Split
        const sChunks = text.match(/[^.!?]+[.!?]+/g) || [text];
        document.getElementById('sentChunks').innerHTML = sChunks.map(c => createChunkUI(c, 1, 'sentence')).join('');
        document.getElementById('sentStats').innerText = sChunks.length;

        // 5. Structure Split (Markdown Headers)
        const stChunks = text.split(/(?=# )|(?=## )|(?=### )/g).filter(s => s.trim() !== "");
        document.getElementById('structChunks').innerHTML = stChunks.map(c => createChunkUI(c, c.length, 'chars')).join('');
        document.getElementById('structStats').innerText = stChunks.length;
    }

    [source, 'charSize', 'charOverlap', 'recSize', 'tokSize', 'tokOverlap', 'sentMin'].forEach(id => {
        const el = typeof id === 'string' ? document.getElementById(id) : id;
        el.addEventListener('input', update);
    });

    update();
</script>
</body>
</html>
